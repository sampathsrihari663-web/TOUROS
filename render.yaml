services:
  # 1. Backend REST API Service
  - type: web
    name: touros-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard

  # 2. Frontend React Client (Vite)
  - type: web
    name: touros-frontend
    env: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: touros-backend
          property: host

